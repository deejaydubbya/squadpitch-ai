app = "squadpitch-ai"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  SP_AI_APP_ENV = "production"
  SP_AI_LOG_LEVEL = "INFO"
  # Fly private DNS resolves *.internal to the app's 6PN IPv6 address.
  # Uvicorn must listen on IPv6 for direct private service-to-service traffic.
  SP_AI_API_HOST = "::"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

  [[http_service.checks]]
    interval = "30s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "python -m squadpitch_ai.api.app"
