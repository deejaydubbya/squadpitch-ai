app = "squadpitch-ai-worker"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  SP_AI_APP_ENV = "production"
  SP_AI_LOG_LEVEL = "INFO"
  SP_AI_WORKER_HEARTBEAT_INTERVAL_SECONDS = "30"
  SP_AI_WORKER_HEARTBEAT_TTL_SECONDS = "360"

[processes]
  worker = "python -m squadpitch_ai.worker.app"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
